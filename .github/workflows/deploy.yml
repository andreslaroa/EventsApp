name: Deploy Events App

on:
  push:
    branches: [ "main" ] # Se activa cuando subes algo a main

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Aquí es donde tienes los 7GB de RAM
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Backend Tests
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r backend/requirements.txt
          pytest tests/ -v || echo "No tests found"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: events-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Aquí el npm install correrá dentro del build de Docker con mucha RAM
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest

  deploy:
    needs: build-and-push # Solo corre si el build fue exitoso
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: andreslaroa.duckdns.org
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Nos logueamos en ECR desde la EC2
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            
            # Limpiamos e iniciamos el nuevo contenedor
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/events-app:latest
            docker stop events-app || true
            docker rm events-app || true
            docker run -d --name events-app --restart always -p 8000:8000 ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/events-app:latest
